<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1 class="my-4">Contact Us</h1>
        <form id="contactForm" class="shadow p-4 rounded bg-white">
            <div class="form-floating mb-3">
                <input type="text" class="form-control" id="name" name="name" placeholder="Enter your name" required>
                <label for="name">Name:</label>
                <div id="nameError" class="invalid-feedback">Please enter your name</div>
            </div>
            <div class="form-floating mb-3">
                <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email" required>
                <label for="email">Email:</label>
                <div id="emailError" class="invalid-feedback">Please enter a valid email</div>
            </div>
            <div class="form-floating mb-3">
                <textarea class="form-control" placeholder="Enter your message" id="message" name="message" rows="4" required></textarea>
                <label for="message">Message:</label>
                <div id="messageError" class="invalid-feedback">Please enter your message</div>
            </div>
            <button class="btn btn-primary w-100" type="submit">Submit</button>
        </form>
    </div>

    <script>
        const form = document.getElementById('contactForm');

        form.addEventListener('submit', function(event) {
            let isValid = true;

            // Reset error messages
            document.querySelectorAll('.invalid-feedback').forEach(el => el.style.display = 'none');
            document.querySelectorAll('.form-control').forEach(el => el.classList.remove('is-invalid'));

            // Validate Name
            const nameInput = document.getElementById('name');
            const name = nameInput.value.trim();
            const nameError = document.getElementById('nameError');
            if (!name) {
                nameError.style.display = 'block';
                nameInput.classList.add('is-invalid');
                isValid = false;
            }

            // Validate Email
            const emailInput = document.getElementById('email');
            const email = emailInput.value.trim();
            const emailError = document.getElementById('emailError');
            if (!email) {
                emailError.style.display = 'block';
                emailInput.classList.add('is-invalid');
                isValid = false;
            } else if (!/^[\w-]+(\.[\w-]+)*@([\w-]+\.)+[a-zA-Z]{2,7}$/.test(email)) {
                emailError.textContent = 'Invalid email format';
                emailError.style.display = 'block';
                emailInput.classList.add('is-invalid');
                isValid = false;
            }

            // Validate Message
            const messageInput = document.getElementById('message');
            const message = messageInput.value.trim();
            const messageError = document.getElementById('messageError');
            if (!message) {
                messageError.style.display = 'block';
                messageInput.classList.add('is-invalid');
                isValid = false;
            }

            if (!isValid) {
                event.preventDefault(); // Prevent form submission
            }
        });
    </script>
</body>
</html>
